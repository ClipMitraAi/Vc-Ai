name: Android CI & Release Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: android-project

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # gradlew repo mein nahi hai, isliye Gradle khud install hoga (wrapper ki zaroorat nahi)
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug APK (phone mein install ke liye)
        run: gradle assembleDebug --stacktrace

      - name: Build Release APK
        run: gradle assembleRelease --stacktrace

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AI-Voice-Studio-APKs
          path: |
            android-project/app/build/outputs/apk/debug/*.apk
            android-project/app/build/outputs/apk/release/*.apk
          retention-days: 14
